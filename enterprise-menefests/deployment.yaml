```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-webapp
  template:
    metadata:
      labels:
        app: enterprise-webapp
    spec:
      containers:
      - name: enterprise-webapp
        image: YOUR_DOCKERHUB_USERNAME/simple-webapp:v1
        ports:
        - containerPort: 80
```
