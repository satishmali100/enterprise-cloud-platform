
YAML file must **not** contain markdown code fences.

Fix file like this only:

```yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-webapp
spec:
  replicas: 4
  selector:
    matchLabels:
      app: enterprise-webapp
  template:
    metadata:
      labels:
        app: enterprise-webapp
    spec:
      containers:
      - name: enterprise-webapp
        image: nginx:latest
        ports:
        - containerPort: 80