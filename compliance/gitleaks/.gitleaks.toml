title = "enterprise-gitleaks-policy"

[[rules]]
id = "generic-api-key"
description = "Generic API key or token"
regex = '''(?i)(api_key|apikey|secret|token)\s*[:=]\s*['"][A-Za-z0-9_\-]{12,}['"]'''
tags = ["secret", "token"]

[[rules]]
id = "generic-password"
description = "Generic hardcoded password"
regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*['"][^'"]{6,}['"]'''
tags = ["password"]