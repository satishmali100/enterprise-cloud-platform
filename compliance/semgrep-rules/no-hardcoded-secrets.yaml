rules:
  - id: no-hardcoded-password
    message: "Hardcoded password found."
    severity: ERROR
    languages:
      - generic
    pattern-regex: '(password|passwd|pwd)\s*[:=]\s*["''][^"'']+["'']'

  - id: no-hardcoded-api-key
    message: "Hardcoded API key/token found."
    severity: ERROR
    languages:
      - generic
    pattern-regex: '(api_key|apikey|token|secret)\s*[:=]\s*["''][A-Za-z0-9_\-]{12,}["'']'